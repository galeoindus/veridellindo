# Veridellindo — Cloudflare Pages configuration.
#
# A static site with no build step, plus Pages Functions in ./functions, so
# Pages only needs to know where the files are.
#
#   npm run deploy        # creates the project if it is missing, then deploys
#
# or by hand:
#
#   npx wrangler pages project create veridellindo --production-branch=main
#   npx wrangler pages deploy . --project-name=veridellindo
#
# The project name here, the --project-name in .github/workflows/deploy.yml,
# SITE.origin in assets/js/config.js and the host in robots.txt, sitemap.xml
# and the pages are one identity: https://veridellindo.pages.dev .
# Change them together, in one commit, or the canonical URLs stop matching the
# host that actually serves the site.
#
# Headers and redirects live in _headers and _redirects at the repository root.

name = "veridellindo"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

# ── Workers AI ────────────────────────────────────────────────────────────
# The /api/chat Pages Function reads this binding. No provider key is needed.
# Workers AI has a daily included allocation; usage beyond it depends on plan and billing.
#
# If the binding is added in the dashboard instead (Pages → Settings →
# Functions → Bindings → Workers AI, variable name AI), this block is
# redundant but harmless — the name must match.
[ai]
binding = "AI"

# ── AI routing ────────────────────────────────────────────────────────────
# The current /api/chat Function owns its model allowlists in code. It tries
# Workers AI first and may fall back to its fixed OpenRouter free-model list
# when one of the OPENROUTER_API_KEY_* secrets is configured. Do not add
# AI_PROVIDER / paid-model flags here unless the Function is changed to read
# and enforce them.
